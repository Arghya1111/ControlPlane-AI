id: "customer_support_bot"
aliases:
  - "customer_chatbot"
name: "Customer Support Virtual Assistant"
channel_type: "customer_facing"
latency_budget_ms: 350
risk_tolerance: "medium"
fail_mode: "fail_closed"
requires_human_review_above: 0.65

# Enabled risk detectors for fast customer-facing operations
enabled_detectors:
  - "pii_entity_detector"
  - "retrieval_verification_detector"
  - "bias_heuristic_detector"
  - "statistical_anomaly_detector"

# Weighting configuration (normalized during scoring)
detector_weights:
  pii_entity_detector: 0.35
  retrieval_verification_detector: 0.30
  bias_heuristic_detector: 0.25
  statistical_anomaly_detector: 0.10

# Threshold bands mapping aggregate confidence to decision tiers
threshold_bands:
  allow: [0.0, 0.30]
  edit: [0.30, 0.55]
  flag_for_review: [0.55, 0.75]
  block: [0.75, 1.0]
